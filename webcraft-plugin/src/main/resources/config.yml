# WebCraft bridge config

# Address and port the WebSocket server listens on.
# The port must be an extra allocation of your server (e.g. in your hosting panel).
host: 0.0.0.0
port: 25007

# World WebCraft players join. Empty = the first (main) world.
world: ""

# Name prefix for WebCraft players, so they can never take over a real Minecraft account.
# Changing it later gives every WebCraft player a new, empty account (the name is the account).
# Servers that ran the old "GgBridge" plugin keep its prefix "gg_" (the old config is taken over).
name-prefix: "wc_"

# WebCraft accounts need a password: the first login sets it, then name + password (plugins/WebCraft/passwords.json).
# Reset a forgotten one with /webcraft password <name>.
passwords: true
# false: only accounts an admin made on the admin page (/webcraft admin) can log in.
self-register: true
# Address of your WebCraft page (e.g. https://example.org/), used for the admin page link of /webcraft admin.
web-url: ""

# Maximum number of WebCraft players at the same time.
max-players: 10

# How many chunks around a WebCraft player are sent to the browser (radius).
view-distance: 6

# How many chunks per server tick are prepared for each WebCraft player.
chunks-per-tick: 3

# Players, mobs and items within this many blocks are shown in the browser.
entity-range: 64


# Allowed browser origins (where the WebCraft website runs), e.g. "https://webcraft.example.com".
# Empty list = allow all (fine for testing).
allowed-origins: []


# Write every block a WebCraft player breaks or places to plugins/WebCraft/blocklog.csv (handy against griefing).
log-blocks: true

# Load Minecraft's own sounds and the German/other names of blocks, items and mobs from Mojang's servers and pass
# them on to the browsers. Off by default: Mojang's files may only go to people who own Minecraft, and browser
# players don't need to. Without it WebCraft uses its built-in free sounds (or plugins/WebCraft/sounds.zip) and
# English names.
mojang-assets: false

# Single player: in the browser's login form players can pick "Einzelspieler" and get an own world on this server
# (own nether and end) that nobody else can enter. It is a separate player with its own inventory, named with this
# prefix (sp_Max). Every single player world that is in use costs memory like a normal world.
singleplayer: true
singleplayer-prefix: "sp_"
