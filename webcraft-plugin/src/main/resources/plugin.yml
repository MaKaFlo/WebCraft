name: WebCraft
version: '${project.version}'
main: de.p300.webcraft.WcPlugin
api-version: '26.3'
softdepend: [voicechat]
description: Lets players of the WebCraft browser game join this server.
commands:
  webcraft:
    description: Link your account with WebCraft (/webcraft link), admins also status, kick and reload.
    aliases: [wc]
    usage: /webcraft [link [delete|<code>]|status|kick <name>|reload|password <name>|admin]
permissions:
  webcraft.admin:
    description: Use /webcraft admin commands.
    default: op
  webcraft.link:
    description: Link a Minecraft account with a WebCraft account (/webcraft link).
    default: true
  webcraft.textures:
    description: Upload the WebCraft texture pack for everyone from the texture studio.
    default: op
