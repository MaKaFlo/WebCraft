# WebCraft settings (Fabric). After a change: /webcraft reload

# Address and port the WebSocket server listens on.
# The port must be reachable from outside (e.g. an extra port of your hosting), or use the nginx container.
host=0.0.0.0
port=25007

# Dimension WebCraft players join, e.g. minecraft:overworld. Empty = the overworld.
world=

# Name prefix for WebCraft players, so they can never take over a real Minecraft account.
# Changing it later gives every WebCraft player a new, empty account (the name is the account).
name-prefix=wc_

# Maximum number of WebCraft players at the same time.
max-players=10

# How many chunks around a WebCraft player are sent to the browser (radius).
view-distance=6

# How many chunks per server tick are prepared for each WebCraft player.
chunks-per-tick=3

# Players, mobs and items within this many blocks are shown in the browser.
entity-range=64

# Allowed browser origins (where the WebCraft website runs), comma separated,
# e.g. https://webcraft.example.com  Empty = allow all (fine for testing).
allowed-origins=

# Write every block a WebCraft player breaks or places to config/webcraft/blocklog.csv (handy against griefing).
log-blocks=true
