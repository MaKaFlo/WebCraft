# Builds WebCraft on every push to main (and for pull requests).
# A tag like v1.2.3 also builds that version and publishes a GitHub release with the plugin jar and the game page.
name: Build

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The plugin compiles against the Paper server itself (not in any Maven repository)
      - name: Cache Paper server
        id: paper
        uses: actions/cache@v4
        with:
          path: .paper
          key: paper-26.3-${{ hashFiles('tools/fetch-paper.sh') }}

      - name: Download Paper 26.3
        if: steps.paper.outputs.cache-hit != 'true'
        run: bash tools/fetch-paper.sh 26.3

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build
        run: mvn -B package

      - name: Collect files
        run: |
          mkdir -p out
          find webcraft-plugin/target -maxdepth 1 -name 'webcraft-*.jar' -exec cp {} out/ \;
          cp webcraft-web/target/webcraft.html out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: webcraft
          path: out/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webcraft
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          name: WebCraft ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
